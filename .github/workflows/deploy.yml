name: Deploy

# Triggered whenever a deploy:* label is added to a PR.
#
# Promotion flow (add labels in order):
#   1. deploy:int   --> deploys SST to the int AWS account
#   2. deploy:stage --> deploys SST to the stage AWS account
#                       (blocked unless deploy:int label is also present)
#   3. deploy:prod  --> deploys SST to the prod AWS account
#                       (blocked unless deploy:int and deploy:stage are present)
#                       (also gated by GitHub Environment required reviewers)
#                       (on success, merges the PR into main if it targets main)
#
# Setup required (one-time, outside this repo):
#   1. Create GitHub Environments: int, stage, prod
#      - Set "Required reviewers" on prod
#   2. Add secrets to each Environment:
#      - AWS_ROLE_ARN  (arn:aws:iam::<account-id>:role/GitHubActions-<Env>)
#      - DNS_ROLE_ARN  (cross-account role in the management account for Route 53)
#   3. Add variables to each Environment:
#      - APP_URL             (e.g. https://my-app-int.apps.example.com)
#      - APPS_HOSTED_ZONE_ID (Route 53 hosted zone ID in the management account)
#   4. Create IAM OIDC provider + role in each AWS account with trust policy:
#      Condition: token.actions.githubusercontent.com:sub =
#        "repo:<org>/<repo>:environment:<env-name>"
#
# See README.md > "GitHub Actions & Labels" for the full deployment guide.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: deploy-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  setup:
    if: startsWith(github.event.label.name, 'deploy:')
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.parse.outputs.env_name }}
    steps:
      - id: parse
        name: Parse environment from label
        run: |
          LABEL="${{ github.event.label.name }}"
          ENV_NAME="${LABEL#deploy:}"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

  gate:
    needs: setup
    if: needs.setup.outputs.env_name == 'stage' || needs.setup.outputs.env_name == 'prod'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check prerequisite deploy labels
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ needs.setup.outputs.env_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '.labels[].name')
          echo "Current PR labels: $labels"

          if [ "$ENV_NAME" = "stage" ]; then
            echo "$labels" | grep -q "deploy:int" \
              || (echo "ERROR: 'deploy:int' label must be present before promoting to stage." && exit 1)
          fi

          if [ "$ENV_NAME" = "prod" ]; then
            echo "$labels" | grep -q "deploy:int" \
              || (echo "ERROR: 'deploy:int' label must be present before promoting to prod." && exit 1)
            echo "$labels" | grep -q "deploy:stage" \
              || (echo "ERROR: 'deploy:stage' label must be present before promoting to prod." && exit 1)
          fi

  deploy:
    name: Deploy → ${{ needs.setup.outputs.env_name }}
    needs:
      - setup
      - gate
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.setup.outputs.env_name == 'int' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    # The "prod" GitHub Environment enforces required-reviewer approval
    # before credentials are issued — the second gate after label checks.
    environment: ${{ needs.setup.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      APP_URL: ${{ vars.APP_URL }}
      APPS_HOSTED_ZONE_ID: ${{ vars.APPS_HOSTED_ZONE_ID }}
      DNS_ROLE_ARN: ${{ secrets.DNS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/setup-env

      - name: Assume cross-account DNS role
        if: env.DNS_ROLE_ARN != ''
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "$DNS_ROLE_ARN" \
            --role-session-name "SSTDnsProvider" \
            --duration-seconds 3600 \
            --output json)
          echo "DNS_AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

      - run: pnpm exec sst unlock --stage ${{ needs.setup.outputs.env_name }}

      - name: Deploy SST
        run: pnpm exec sst deploy --stage ${{ needs.setup.outputs.env_name }}

      - name: Swap label to error on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ needs.setup.outputs.env_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "deploy-failed:${ENV_NAME}" \
            --color "d73a4a" \
            --description "Deploy to ${ENV_NAME} failed" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:${ENV_NAME}" \
            --add-label "deploy-failed:${ENV_NAME}" \
            --repo "$GITHUB_REPOSITORY"

  merge-to-main:
    name: Merge to main
    needs:
      - setup
      - deploy
    if: needs.setup.outputs.env_name == 'prod' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR into main after successful prod deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')
          if [ "$BASE" != "main" ]; then
            echo "PR #$PR_NUMBER targets '$BASE', not main — skipping auto-merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" \
            --merge \
            --repo "$GITHUB_REPOSITORY"
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:prod" \
            --remove-label "deploy-blocked:prod" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
